name: Validate plugins
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Catalog & manifest validation
        run: python3 scripts/validate.py
      - name: Public hygiene check
        run: python3 scripts/check_hygiene.py --tracked
      - name: Formal verification suite
        run: python3 -m unittest discover -s tests -p "test_*_formal_verification.py" -v
      - name: Offline unit test suite
        run: python3 -m unittest discover -s tests -v
