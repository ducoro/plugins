<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics &amp; Retrospective Board</title>
  <link rel="stylesheet" href="./runtime/board-ui.css" />
  <style>
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .trend-svg { width: 100%; height: 196px; display: block; }
    .retro-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .retro-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .retro-check { display: inline-flex; align-items: center; gap: 8px; }
    .retro-done { color: var(--muted-foreground); text-decoration: line-through; }
  </style>
</head>
<body>
  <div class="ui-shell" data-export-frame="analytics-summary">
    <header class="ui-header" data-card="analytics-header" data-card-title="Analytics & Retro">
      <div>
        <h1 class="ui-title" data-mark-item="board-title" data-mark-label="Analytics Title">Analytics &amp; Retrospective</h1>
        <p class="ui-subtitle" id="subtitle">Loading analytics snapshot...</p>
      </div>
      <div class="ui-toolbar" data-mark-ignore>
        <div class="ui-tabs" role="tablist" aria-label="Time window">
          <button class="ui-tab" type="button" role="tab" data-days="7">7d</button>
          <button class="ui-tab" type="button" role="tab" data-days="14">14d</button>
          <button class="ui-tab" type="button" role="tab" data-days="30">30d</button>
        </div>
        <select class="ui-select" id="platformFilter" aria-label="Filter by platform"><option value="all">All Platforms (Cross-Compare)</option></select>
      </div>
    </header>

    <div class="ui-alert" data-bridge-status data-mark-ignore hidden></div>
    <section class="ui-kpi-grid" id="kpis" data-card="kpi-summary" data-card-title="KPI Summary"></section>

    <section class="ui-section" id="nativeSection" hidden>
      <div class="ui-section-head">
        <h2 class="ui-section-title" id="nativeHeading">Platform-Native Metrics</h2>
      </div>
      <div class="metric-grid" id="nativeMetrics" data-card="platform-native-metrics" data-card-title="Platform Native Metrics"></div>
    </section>

    <section class="ui-section" id="accountSection" hidden>
      <div class="ui-section-head">
        <h2 class="ui-section-title">Account Snapshots</h2>
      </div>
      <div class="metric-grid" id="accountGrid" data-card="account-growth" data-card-title="Account Snapshots"></div>
    </section>

    <section class="ui-section">
      <div class="ui-section-head">
        <h2 class="ui-section-title">Views Trend</h2>
        <span class="ui-muted">Daily captured views</span>
      </div>
      <div class="ui-card" id="trendPanel" data-card="trend-chart" data-card-title="Performance Trend"></div>
    </section>

    <section class="ui-section">
      <div class="ui-section-head">
        <h2 class="ui-section-title">Same-Topic Cross-Platform Comparison</h2>
      </div>
      <div id="crossPanel" data-card="cross-platform" data-card-title="Cross-Platform Comparison"></div>
    </section>

    <section class="ui-section" data-card="works-leaderboard" data-card-title="Works Leaderboard">
      <div class="ui-section-head">
        <h2 class="ui-section-title">Top Works</h2>
      </div>
      <div class="ui-table-wrap">
        <table class="ui-table">
          <thead>
            <tr>
              <th>Work</th>
              <th>Platform</th>
              <th>Window</th>
              <th class="is-num">Views</th>
              <th class="is-num">Likes</th>
              <th class="is-num">Comments</th>
              <th class="is-num">Saves</th>
              <th class="is-num">Eng %</th>
            </tr>
          </thead>
          <tbody id="worksBody"></tbody>
        </table>
      </div>
    </section>

    <section class="ui-section">
      <div class="ui-section-head">
        <h2 class="ui-section-title">Latest Retrospective &amp; Next-Cycle Actions</h2>
      </div>
      <div class="ui-card" id="retroPanel" data-card="retro-actions" data-card-title="Retrospective Actions"></div>
    </section>
  </div>

  <script id="board-initial-data" type="application/json">
  {"schemaVersion":1,"board":"analytics-retro-board","generatedAt":"","timezone":"UTC","platforms":[],"summary":{"totalWorks":0,"totalViews":0,"totalLikes":0,"totalComments":0,"totalShares":0,"totalSaves":0,"avgEngagementRate":0},"trend":[],"trendByPlatform":{},"crossPlatform":[],"works":[],"accountSnapshots":[],"retro":{"file":null,"title":"No retrospective recorded yet","actions":[]}}
  </script>

  <script type="module">
    import { createBoardBridge } from './runtime/board-sdk-bridge.js';

    const VALID_DAYS = [7, 14, 30];
    let payload = null;
    const view = { days: 14, platform: 'all', focusWorkId: '' };
    const platEl = document.getElementById('platformFilter');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const bridge = createBoardBridge({
      boardId: 'analytics-retro-board',
      defaultView: { days: 14, platform: 'all' },
      getView: () => ({ days: view.days, platform: view.platform }),
      onApplyView: (saved) => {
        if (VALID_DAYS.includes(Number(saved.days))) view.days = Number(saved.days);
        if (typeof saved.platform === 'string') view.platform = saved.platform;
        syncInputs();
        render();
      },
      onData: (next) => {
        payload = next;
        const plats = payload.platforms || [];
        if (view.platform !== 'all' && !plats.includes(view.platform)) view.platform = 'all';
        platEl.innerHTML = '<option value="all">All Platforms (Cross-Compare)</option>' +
          plats.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
        syncInputs();
        render();
      },
      commands: {
        setRange: {
          describe: 'Set analytics trend range window in days.',
          params: { days: 'One of: 7, 14, 30.' },
          run: ({ days }) => {
            const n = Number(days);
            if (!VALID_DAYS.includes(n)) throw new Error('days must be 7, 14, or 30');
            view.days = n;
            syncInputs();
            render();
          },
        },
        filterPlatform: {
          describe: 'Filter analytics to one platform slug (revealing native metrics) or "all".',
          params: { platform: 'Platform slug or "all".' },
          run: ({ platform }) => {
            const valid = ['all', ...(payload?.platforms || [])];
            if (!valid.includes(platform)) throw new Error(`Unknown platform "${platform}". Valid values: ${valid.join(', ')}`);
            view.platform = platform;
            syncInputs();
            render();
          },
        },
        focusWork: {
          describe: 'Highlight and scroll to a specific workId in the leaderboard.',
          params: { workId: 'Exact workId from analytics/snapshots.jsonl.' },
          run: ({ workId }) => {
            const list = payload?.works || [];
            const match = list.find((w) => w.workId === workId);
            if (!match) throw new Error(`Unknown workId "${workId}". Valid IDs: ${list.map((w) => w.workId).join(', ') || '(none)'}`);
            if (view.platform !== 'all' && match.platform !== view.platform) view.platform = 'all';
            const workDate = String(match.capturedAt || '').slice(0, 10);
            if (workDate) {
              const curCutoff = new Date(Date.now() - view.days * 86400 * 1000).toISOString().slice(0, 10);
              if (workDate < curCutoff) {
                for (const d of VALID_DAYS) {
                  const nextCutoff = new Date(Date.now() - d * 86400 * 1000).toISOString().slice(0, 10);
                  if (workDate >= nextCutoff) { view.days = d; break; }
                  view.days = 30;
                }
              }
            }
            view.focusWorkId = workId;
            syncInputs();
            render();
            document.querySelector(`[data-mark-item="work-${CSS.escape(workId)}"]`)?.scrollIntoView({ behavior: 'auto', block: 'center' });
          },
        },
      },
    });

    function syncInputs() {
      platEl.value = view.platform;
      for (const btn of document.querySelectorAll('.ui-tab[data-days]')) {
        const active = Number(btn.dataset.days) === view.days;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-selected', String(active));
      }
    }

    function renderTrendSvg(points) {
      if (!points.length) return '<div class="ui-empty-inline">No snapshot trend data in this window yet.</div>';
      const maxViews = Math.max(...points.map((p) => p.views), 1);
      const w = 760, h = 180, padL = 48, padR = 20, padT = 16, padB = 26;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const step = points.length > 1 ? plotW / (points.length - 1) : 0;
      const coords = points.map((p, i) => {
        const x = points.length > 1 ? padL + i * step : padL + plotW / 2;
        const y = padT + plotH - ((p.views / maxViews) * plotH);
        return { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)), ...p };
      });
      const poly = coords.map((c) => `${c.x},${c.y}`).join(' ');
      const area = coords.length > 1
        ? `M ${coords[0].x},${padT + plotH} L ${coords.map((c) => `${c.x},${c.y}`).join(' L ')} L ${coords[coords.length - 1].x},${padT + plotH} Z`
        : '';
      const gridTicks = [0, 0.5, 1].map((t) => {
        const gy = Number((padT + plotH * (1 - t)).toFixed(1));
        const val = Math.round(maxViews * t).toLocaleString();
        return `<line x1="${padL}" y1="${gy}" x2="${w - padR}" y2="${gy}" stroke="var(--border)" stroke-dasharray="${t === 0 ? '' : '3 3'}" />`
          + `<text x="${padL - 8}" y="${gy + 4}" font-size="11" text-anchor="end" fill="var(--muted-foreground)">${val}</text>`;
      }).join('');
      const xLabels = coords
        .filter((_, i) => i === 0 || i === coords.length - 1 || i === Math.floor(coords.length / 2))
        .map((c) => `<text x="${c.x}" y="${h - 6}" font-size="11" text-anchor="middle" fill="var(--muted-foreground)">${esc(c.date)}</text>`)
        .join('');
      return `
        <svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Views trend">
          <defs>
            <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--chart-1)" stop-opacity="0.18" />
              <stop offset="100%" stop-color="var(--chart-1)" stop-opacity="0" />
            </linearGradient>
          </defs>
          ${gridTicks}
          ${area ? `<path d="${area}" fill="url(#trendFill)" />` : ''}
          <polyline fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${poly}" />
          ${coords.map((c) => `<circle cx="${c.x}" cy="${c.y}" r="3.5" fill="var(--card)" stroke="var(--chart-1)" stroke-width="2"><title>${esc(c.date)}: ${c.views.toLocaleString()} views (${c.engagementRate}% eng)</title></circle>`).join('')}
          ${xLabels}
        </svg>`;
    }

    function render() {
      if (!payload) return;
      document.getElementById('subtitle').textContent = `Window ${view.days}d · Synced ${payload.generatedAt || 'pending'}`;

      const cutoffDate = new Date(Date.now() - view.days * 86400 * 1000).toISOString().slice(0, 10);
      let works = (payload.works || []).filter((w) => {
        const d = String(w.capturedAt || '').slice(0, 10);
        return !d || d >= cutoffDate;
      });
      if (view.platform !== 'all') works = works.filter((w) => w.platform === view.platform);

      const totals = works.reduce((acc, w) => {
        acc.views += w.views || 0;
        acc.likes += w.likes || 0;
        acc.comments += w.comments || 0;
        acc.shares += w.shares || 0;
        acc.saves += w.saves || 0;
        return acc;
      }, { views: 0, likes: 0, comments: 0, shares: 0, saves: 0 });
      const inter = totals.likes + totals.comments + totals.shares + totals.saves;
      const avgEng = totals.views > 0 ? ((inter / totals.views) * 100).toFixed(2) : '0.00';

      document.getElementById('kpis').innerHTML = [
        ['Tracked Works', works.length, 'kpi-works'],
        ['Total Views', totals.views.toLocaleString(), 'kpi-views'],
        ['Likes / Saves', `${totals.likes.toLocaleString()} / ${totals.saves.toLocaleString()}`, 'kpi-likes'],
        ['Comments / Shares', `${totals.comments.toLocaleString()} / ${totals.shares.toLocaleString()}`, 'kpi-comments'],
        ['Avg Engagement', `${avgEng}%`, 'kpi-eng'],
      ].map(([label, val, id]) => `
        <div class="ui-kpi" data-mark-item="${id}" data-mark-label="${label}">
          <div class="ui-kpi-label">${label}</div>
          <div class="ui-kpi-value">${val}</div>
        </div>`).join('');

      const nativeSection = document.getElementById('nativeSection');
      if (view.platform !== 'all') {
        const agg = {}, counts = {};
        for (const w of works) {
          for (const [k, v] of Object.entries(w.platformMetrics || {})) {
            if (typeof v === 'number') { agg[k] = (agg[k] || 0) + v; counts[k] = (counts[k] || 0) + 1; }
          }
        }
        const entries = Object.keys(agg);
        nativeSection.hidden = entries.length === 0;
        document.getElementById('nativeHeading').textContent = `${view.platform} Native Metrics (Average)`;
        document.getElementById('nativeMetrics').innerHTML = entries.map((k) => `
          <div class="ui-kpi" data-mark-item="native-${esc(k)}" data-mark-label="${esc(k)}">
            <div class="ui-kpi-label">${esc(k)}</div>
            <div class="ui-kpi-value">${(agg[k] / counts[k]).toFixed(2)}</div>
          </div>`).join('');
      } else {
        nativeSection.hidden = true;
      }

      const accountSection = document.getElementById('accountSection');
      let acctSnaps = (payload.accountSnapshots || []).slice();
      if (view.platform !== 'all') acctSnaps = acctSnaps.filter((a) => a.platform === view.platform);
      accountSection.hidden = acctSnaps.length === 0;
      document.getElementById('accountGrid').innerHTML = acctSnaps.map((a) => {
        const aid = a.accountId || a.platform || 'account';
        const metricText = Object.entries(a.metrics || {})
          .filter(([, v]) => typeof v === 'number' || typeof v === 'string')
          .map(([k, v]) => `${esc(k)}: ${typeof v === 'number' ? v.toLocaleString() : esc(v)}`)
          .join(' · ') || 'No metrics';
        return `
          <div class="ui-kpi" data-mark-item="acct-${esc(aid)}" data-mark-label="Account ${esc(aid)}">
            <div class="ui-kpi-label">${esc(a.platform || 'account')} · ${esc(aid)}</div>
            <div class="ui-kpi-value" style="font-size:14px;font-weight:500">${metricText}</div>
          </div>`;
      }).join('');

      const rawTrend = (payload.trendByPlatform && payload.trendByPlatform[view.platform]) || (view.platform === 'all' ? (payload.trend || []) : []);
      document.getElementById('trendPanel').innerHTML = renderTrendSvg(rawTrend.filter((p) => p.date >= cutoffDate));

      const visibleIds = new Set(works.map((w) => `${w.platform}:${w.workId}`));
      const cross = (payload.crossPlatform || [])
        .map((row) => ({ ...row, entries: (row.entries || []).filter((e) => visibleIds.has(`${e.platform}:${e.workId}`)) }))
        .filter((row) => row.entries.length >= 2);
      document.getElementById('crossPanel').innerHTML = cross.length === 0
        ? '<div class="ui-empty">Publish the same topicId to 2+ platforms to unlock side-by-side comparison.</div>'
        : `<div class="ui-table-wrap"><table class="ui-table"><thead><tr><th>Topic ID</th><th>Platform Breakdown (Views / Eng %)</th></tr></thead><tbody>${
            cross.map((row) => `
              <tr data-mark-item="cross-${esc(row.topicId)}" data-mark-label="Cross-compare ${esc(row.topicId)}">
                <td class="ui-mono">${esc(row.topicId)}</td>
                <td class="ui-num">${row.entries.map((e) => `<span class="ui-badge ui-badge-secondary" style="margin-right:6px">${esc(e.platform)} · ${e.views.toLocaleString()} (${e.engagementRate}%)</span>`).join('')}</td>
              </tr>`).join('')
          }</tbody></table></div>`;

      document.getElementById('worksBody').innerHTML = works.length === 0
        ? '<tr><td colspan="8" class="ui-muted" style="text-align:center;padding:24px">No work snapshots recorded yet.</td></tr>'
        : works.map((w) => {
            const focused = view.focusWorkId === w.workId ? ' class="focused"' : '';
            return `
              <tr${focused} data-mark-item="work-${esc(w.workId)}" data-mark-label="${esc(w.title)}">
                <td style="font-weight:500">${esc(w.title)}</td>
                <td><span class="ui-badge ui-badge-secondary">${esc(w.platform)}</span></td>
                <td class="ui-muted">${esc(w.window)}</td>
                <td class="is-num">${w.views.toLocaleString()}</td>
                <td class="is-num">${w.likes.toLocaleString()}</td>
                <td class="is-num">${w.comments.toLocaleString()}</td>
                <td class="is-num">${w.saves.toLocaleString()}</td>
                <td class="is-num">${w.engagementRate}%</td>
              </tr>`;
          }).join('');

      const retro = payload.retro || { title: 'No retrospective yet', actions: [] };
      document.getElementById('retroPanel').innerHTML = `
        <div class="ui-meta-row" style="justify-content:space-between;margin-bottom:${retro.actions.length ? '8px' : '0'}">
          <strong style="font-size:14px;font-weight:600">${esc(retro.title)}</strong>
          <span class="ui-muted ui-mono">${esc(retro.file || '')}</span>
        </div>
        ${retro.actions.length === 0
          ? '<div class="ui-muted" style="margin-top:6px">Add a weekly markdown file under analytics/retros/YYYY-Www.md.</div>'
          : retro.actions.map((a) => `
            <div class="retro-row" data-mark-item="action-${esc(a.id)}" data-mark-label="${esc(a.text)}">
              <span class="retro-check${a.done ? ' retro-done' : ''}">${a.done ? '✓' : '○'} ${esc(a.text)}</span>
              <span data-shot-hide data-mark-ignore>
                <button class="ui-btn ui-btn-xs ui-btn-ghost" type="button" data-requires-sdk data-action="recycle-retro" data-text="${esc(a.text)}">Stage as Topic</button>
              </span>
            </div>`).join('')}`;
      bridge.updateWriteControls();
    }

    document.querySelector('.ui-toolbar').addEventListener('click', (event) => {
      const btn = event.target.closest('.ui-tab[data-days]');
      if (!btn) return;
      view.days = Number(btn.dataset.days);
      syncInputs();
      render();
      void bridge.persistView();
    });

    platEl.addEventListener('change', () => {
      view.platform = platEl.value;
      render();
      void bridge.persistView();
    });

    document.getElementById('retroPanel').addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action="recycle-retro"]');
      if (!btn) return;
      void bridge.stageDraft(
        `Recycle this retrospective finding into next cycle's inbox/ and topics/topics.json: "${btn.dataset.text}"`,
        btn,
      );
    });

    void bridge.start();
  </script>
</body>
</html>
