<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topic Pool &amp; Draft Pipeline Board</title>
  <style>
    :root {
      --bg: #f7f8fa; --surface: #ffffff; --surface-alt: #f1f3f7; --text: #111827;
      --muted: #5b6472; --border: #e2e6ee; --accent: #2563eb;
      --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
      --err: #b91c1c; --err-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f131a; --surface: #171c26; --surface-alt: #1f2633; --text: #f3f4f6;
        --muted: #9ca3af; --border: #2a3342; --accent: #60a5fa;
        --ok: #86efac; --ok-bg: #14532d; --warn: #fcd34d; --warn-bg: #78350f;
        --err: #fca5a5; --err-bg: #7f1d1d; --info: #93c5fd; --info-bg: #1e3a8a;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 20px; }
    header { margin-bottom: 14px; }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    select, button, label { font: inherit; font-size: 13px; }
    select, button { border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 10px; cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-bar { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; background: var(--info-bg); color: var(--info); }
    .status-bar[data-tone="ok"] { background: var(--ok-bg); color: var(--ok); }
    .status-bar[data-tone="warn"] { background: var(--warn-bg); color: var(--warn); }
    .status-bar[data-tone="error"] { background: var(--err-bg); color: var(--err); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
    .board-cols { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; align-items: start; }
    @media (max-width: 980px) { .board-cols { grid-template-columns: repeat(2, minmax(240px, 1fr)); } }
    @media (max-width: 600px) { .board-cols { grid-template-columns: 1fr; } }
    .col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .col-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .card.focused { outline: 2px solid var(--accent); }
    .card-title { font-size: 13px; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11px; }
    .chip { padding: 2px 7px; border-radius: 999px; background: var(--info-bg); color: var(--info); font-weight: 600; }
    .chip-score { background: var(--ok-bg); color: var(--ok); }
    .chip-alert { background: var(--err-bg); color: var(--err); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .actions button { font-size: 11px; padding: 4px 8px; }
    .empty { font-size: 12px; color: var(--muted); padding: 12px 4px; text-align: center; }
    html[data-ducoro-render='shot'] .toolbar,
    html[data-ducoro-render='shot'] .actions,
    html[data-ducoro-render='shot'] .status-bar { display: none !important; }
  </style>
</head>
<body>
  <div class="shell" data-ducoro-export-frame="pipeline-summary">
    <header data-card="pipeline-header" data-card-title="Pipeline Overview">
      <h1 data-mark-item="board-title" data-mark-label="Pipeline Title">Topic Pool &amp; Draft Pipeline</h1>
      <div class="sub" id="subtitle">Loading pipeline snapshot...</div>
    </header>

    <div class="toolbar" data-mark-ignore>
      <select id="planFilter" aria-label="Filter by campaign plan"><option value="all">All Plans</option></select>
      <select id="platformFilter" aria-label="Filter by platform"><option value="all">All Platforms</option></select>
      <label><input type="checkbox" id="alertsOnly" /> Spec Alerts Only</label>
    </div>

    <div class="status-bar" data-bridge-status data-mark-ignore hidden></div>
    <section class="kpis" id="kpis" data-card="pipeline-kpis" data-card-title="Pipeline Summary"></section>
    <main class="board-cols" id="columns"></main>
  </div>

  <script id="board-initial-data" type="application/json">
  {"schemaVersion":1,"board":"pipeline-board","generatedAt":"","timezone":"UTC","platforms":[],"summary":{"inboxCount":0,"candidateTopics":0,"approvedItems":0,"draftsReady":0,"specAlertCount":0},"plans":[],"columns":{"intake":[],"approved":[],"ready":[],"archive":[]}}
  </script>

  <script type="module">
    import { createBoardBridge } from './runtime/board-sdk-bridge.js';

    let payload = null;
    const view = { planId: 'all', platform: 'all', onlyAlerts: false, focusItemId: '' };
    const planEl = document.getElementById('planFilter');
    const platEl = document.getElementById('platformFilter');
    const alertEl = document.getElementById('alertsOnly');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const bridge = createBoardBridge({
      boardId: 'pipeline-board',
      defaultView: { planId: 'all', platform: 'all', onlyAlerts: false },
      getView: () => ({ planId: view.planId, platform: view.platform, onlyAlerts: view.onlyAlerts }),
      onApplyView: (saved) => {
        if (typeof saved.planId === 'string') view.planId = saved.planId;
        if (typeof saved.platform === 'string') view.platform = saved.platform;
        if (typeof saved.onlyAlerts === 'boolean') view.onlyAlerts = saved.onlyAlerts;
        syncInputs();
        render();
      },
      onData: (next) => {
        payload = next;
        populateFilters();
        syncInputs();
        render();
      },
      commands: {
        filterPlan: {
          describe: 'Filter pipeline items by planId or "all".',
          params: { planId: 'Plan ID from drafts/plans.json or "all".' },
          run: ({ planId }) => {
            const valid = ['all', ...(payload?.plans || []).map((p) => p.planId)];
            if (!valid.includes(planId)) throw new Error(`Unknown planId "${planId}". Valid values: ${valid.join(', ')}`);
            view.planId = planId;
            syncInputs();
            render();
          },
        },
        filterPlatform: {
          describe: 'Filter pipeline items by platform slug or "all".',
          params: { platform: 'Platform slug or "all".' },
          run: ({ platform }) => {
            const valid = ['all', ...(payload?.platforms || [])];
            if (!valid.includes(platform)) throw new Error(`Unknown platform "${platform}". Valid values: ${valid.join(', ')}`);
            view.platform = platform;
            syncInputs();
            render();
          },
        },
        focusItem: {
          describe: 'Highlight and scroll to a specific topicId or draftId.',
          params: { itemId: 'Exact topicId or draftId.' },
          run: ({ itemId }) => {
            const all = Object.values(payload?.columns || {}).flat();
            const match = all.find((x) => x.id === itemId);
            if (!match) {
              throw new Error(`Unknown itemId "${itemId}". Valid IDs: ${all.map((x) => x.id).join(', ') || '(none)'}`);
            }
            if (view.planId !== 'all' && match.planId !== view.planId) view.planId = 'all';
            if (view.platform !== 'all' && !(match.platforms || []).includes(view.platform)) view.platform = 'all';
            if (view.onlyAlerts && !(match.specAlerts || []).length) view.onlyAlerts = false;
            view.focusItemId = itemId;
            syncInputs();
            render();
            const prefix = match.itemType === 'topic' ? 'topic' : 'draft';
            document.querySelector(`[data-mark-item="${CSS.escape(`${prefix}-${itemId}`)}"]`)?.scrollIntoView({ behavior: 'auto', block: 'center' });
          },
        },
      },
    });

    function populateFilters() {
      const planIds = (payload?.plans || []).map((p) => p.planId);
      const plats = payload?.platforms || [];
      if (view.planId !== 'all' && !planIds.includes(view.planId)) view.planId = 'all';
      if (view.platform !== 'all' && !plats.includes(view.platform)) view.platform = 'all';
      planEl.innerHTML = '<option value="all">All Plans</option>' +
        (payload?.plans || []).map((p) => `<option value="${esc(p.planId)}">${esc(p.name || p.planId)}</option>`).join('');
      platEl.innerHTML = '<option value="all">All Platforms</option>' +
        plats.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    }

    function syncInputs() {
      planEl.value = view.planId;
      platEl.value = view.platform;
      alertEl.checked = view.onlyAlerts;
    }

    function render() {
      if (!payload) return;
      document.getElementById('subtitle').textContent = `Synced: ${payload.generatedAt || 'not built yet'}`;
      const s = payload.summary || {};
      document.getElementById('kpis').innerHTML = [
        ['Inbox Signals', s.inboxCount ?? 0, 'kpi-inbox'],
        ['Candidate Topics', s.candidateTopics ?? 0, 'kpi-candidates'],
        ['Approved / Drafting', s.approvedItems ?? 0, 'kpi-approved'],
        ['Ready / Scheduled', s.draftsReady ?? 0, 'kpi-ready'],
        ['Spec Alerts', s.specAlertCount ?? 0, 'kpi-alerts'],
      ].map(([label, val, id]) => `
        <div class="kpi" data-mark-item="${id}" data-mark-label="${label}">
          <div class="kpi-label">${label}</div>
          <div class="kpi-value">${val}</div>
        </div>`).join('');

      const stages = [
        ['intake', '1. Intake & Gate 1 Candidates'],
        ['approved', '2. Approved & In Production'],
        ['ready', '3. Ready & Scheduled'],
        ['archive', '4. Published / Archived'],
      ];

      document.getElementById('columns').innerHTML = stages.map(([key, title]) => {
        let items = (payload.columns?.[key] || []).slice();
        if (view.planId !== 'all') items = items.filter((i) => i.planId === view.planId);
        if (view.platform !== 'all') items = items.filter((i) => (i.platforms || []).includes(view.platform));
        if (view.onlyAlerts) items = items.filter((i) => (i.specAlerts || []).length > 0);
        return `
          <section class="col" data-card="stage-${key}" data-card-title="${title}">
            <div class="col-head"><span>${title}</span><span>${items.length}</span></div>
            ${items.length === 0 ? '<div class="empty">No items</div>' : items.map((item) => {
              const prefix = item.itemType === 'topic' ? 'topic' : 'draft';
              const focused = view.focusItemId === item.id ? ' focused' : '';
              const alerts = item.specAlerts || [];
              return `
                <article class="card${focused}" data-mark-item="${prefix}-${esc(item.id)}" data-mark-label="${esc(item.title)}">
                  <div class="card-title">${esc(item.title)}</div>
                  <div class="chips">
                    <span class="chip">${esc(item.status)}</span>
                    ${item.score != null ? `<span class="chip chip-score">Score ${esc(item.score)}</span>` : ''}
                    ${(item.platforms || []).map((p) => `<span class="chip">${esc(p)}</span>`).join('')}
                    ${alerts.length ? `<span class="chip chip-alert">${alerts.length} spec alert(s)</span>` : ''}
                  </div>
                  <div class="actions" data-mark-ignore>
                    ${item.itemType === 'topic' && key === 'intake' ? `<button class="primary" data-requires-sdk data-action="approve-topic" data-id="${esc(item.id)}" data-title="${esc(item.title)}">Draft Gate 1 Approval</button>` : ''}
                    ${alerts.length ? `<button data-requires-sdk data-action="fix-spec" data-id="${esc(item.id)}" data-title="${esc(item.title)}">Draft Spec Fix Request</button>` : ''}
                  </div>
                </article>`;
            }).join('')}
          </section>`;
      }).join('');
      bridge.updateWriteControls();
    }

    document.getElementById('columns').addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id, title } = btn.dataset;
      if (action === 'approve-topic') {
        void bridge.stageDraft(
          `Gate 1 approval for topic ${id} ("${title}"): please write the brief under topics/briefs/${id}.md and begin master copy + platform adaptation.`,
          btn,
        );
      } else if (action === 'fix-spec') {
        void bridge.stageDraft(
          `Please resolve the platform spec alerts on draft ${id} ("${title}"), re-run check_media_specs.py, and rebuild pipeline-board.`,
          btn,
        );
      }
    });

    for (const el of [planEl, platEl, alertEl]) {
      el.addEventListener('change', () => {
        view.planId = planEl.value;
        view.platform = platEl.value;
        view.onlyAlerts = alertEl.checked;
        render();
        void bridge.persistView();
      });
    }

    void bridge.start();
  </script>
</body>
</html>
