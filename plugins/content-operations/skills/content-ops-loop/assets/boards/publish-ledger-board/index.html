<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Matrix &amp; Publish Ledger Board</title>
  <style>
    :root {
      --bg: #f7f8fa; --surface: #ffffff; --surface-alt: #f1f3f7; --text: #111827;
      --muted: #5b6472; --border: #e2e6ee; --accent: #2563eb;
      --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
      --err: #b91c1c; --err-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f131a; --surface: #171c26; --surface-alt: #1f2633; --text: #f3f4f6;
        --muted: #9ca3af; --border: #2a3342; --accent: #60a5fa;
        --ok: #86efac; --ok-bg: #14532d; --warn: #fcd34d; --warn-bg: #78350f;
        --err: #fca5a5; --err-bg: #7f1d1d; --info: #93c5fd; --info-bg: #1e3a8a;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .shell { max-width: 1240px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 20px 0 10px; font-size: 16px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
    select, button { font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 10px; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-bar { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; background: var(--info-bg); color: var(--info); }
    .status-bar[data-tone="ok"] { background: var(--ok-bg); color: var(--ok); }
    .status-bar[data-tone="warn"] { background: var(--warn-bg); color: var(--warn); }
    .status-bar[data-tone="error"] { background: var(--err-bg); color: var(--err); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
    .acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .acct { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .b-active, .b-published { background: var(--ok-bg); color: var(--ok); }
    .b-expiring, .b-manual_browser, .b-draft_saved { background: var(--warn-bg); color: var(--warn); }
    .b-expired, .b-failed, .b-paused { background: var(--err-bg); color: var(--err); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--surface-alt); font-size: 12px; color: var(--muted); }
    tr.focused { outline: 2px solid var(--accent); }
    a { color: var(--accent); text-decoration: none; }
    html[data-ducoro-render='shot'] .toolbar,
    html[data-ducoro-render='shot'] .row-action,
    html[data-ducoro-render='shot'] .status-bar { display: none !important; }
  </style>
</head>
<body>
  <div class="shell" data-ducoro-export-frame="ledger-summary">
    <header data-card="ledger-header" data-card-title="Account Matrix & Publish Ledger">
      <h1 data-mark-item="board-title" data-mark-label="Ledger Title">Account Matrix &amp; Publish Ledger</h1>
      <div class="sub" id="subtitle">Loading ledger snapshot...</div>
    </header>

    <div class="toolbar" data-mark-ignore>
      <select id="platformFilter" aria-label="Filter by platform"><option value="all">All Platforms</option></select>
      <label><input type="checkbox" id="onlyFailed" /> Failed / Needs Attention Only</label>
    </div>

    <div class="status-bar" data-bridge-status data-mark-ignore hidden></div>
    <section class="kpis" id="kpis" data-card="ledger-kpis" data-card-title="Ledger Summary"></section>

    <h2>Connected Accounts</h2>
    <section class="acct-grid" id="accountsGrid" data-card="accounts-matrix" data-card-title="Connected Accounts"></section>

    <h2>Publish Ledger (Append-Only Readback)</h2>
    <section data-card="publish-ledger" data-card-title="Publish Ledger">
      <table>
        <thead>
          <tr><th>Time</th><th>Platform</th><th>Draft / Slot</th><th>Status</th><th>Live Link / Error</th><th class="row-action">Action</th></tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </section>
  </div>

  <script id="board-initial-data" type="application/json">
  {"schemaVersion":1,"board":"publish-ledger-board","generatedAt":"","timezone":"UTC","platforms":[],"summary":{"totalAccounts":0,"healthyAccounts":0,"attentionAccounts":0,"totalPublished":0,"totalFailed":0},"accounts":[],"records":[]}
  </script>

  <script type="module">
    import { createBoardBridge } from './runtime/board-sdk-bridge.js';

    let payload = null;
    const view = { platform: 'all', onlyFailed: false, focusRecordId: '' };
    const platEl = document.getElementById('platformFilter');
    const failEl = document.getElementById('onlyFailed');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const bridge = createBoardBridge({
      boardId: 'publish-ledger-board',
      defaultView: { platform: 'all', onlyFailed: false },
      getView: () => ({ platform: view.platform, onlyFailed: view.onlyFailed }),
      onApplyView: (saved) => {
        if (typeof saved.platform === 'string') view.platform = saved.platform;
        if (typeof saved.onlyFailed === 'boolean') view.onlyFailed = saved.onlyFailed;
        syncInputs();
        render();
      },
      onData: (next) => {
        payload = next;
        const plats = payload.platforms || [];
        if (view.platform !== 'all' && !plats.includes(view.platform)) view.platform = 'all';
        platEl.innerHTML = '<option value="all">All Platforms</option>' +
          plats.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
        syncInputs();
        render();
      },
      commands: {
        filterPlatform: {
          describe: 'Filter accounts and publish records by platform slug or "all".',
          params: { platform: 'Platform slug or "all".' },
          run: ({ platform }) => {
            const valid = ['all', ...(payload?.platforms || [])];
            if (!valid.includes(platform)) throw new Error(`Unknown platform "${platform}". Valid values: ${valid.join(', ')}`);
            view.platform = platform;
            syncInputs();
            render();
          },
        },
        onlyFailed: {
          describe: 'Toggle showing only failed records and attention accounts.',
          params: { enabled: '"true" or "false".' },
          run: ({ enabled }) => {
            if (enabled !== 'true' && enabled !== 'false') throw new Error('enabled must be "true" or "false"');
            view.onlyFailed = enabled === 'true';
            syncInputs();
            render();
          },
        },
        focusRecord: {
          describe: 'Highlight and scroll to a publish record by publishId.',
          params: { pubId: 'Exact publishId from publish-log.jsonl.' },
          run: ({ pubId }) => {
            const recs = payload?.records || [];
            const match = recs.find((r) => r.publishId === pubId);
            if (!match) {
              throw new Error(`Unknown pubId "${pubId}". Valid IDs: ${recs.map((r) => r.publishId).join(', ') || '(none)'}`);
            }
            if (view.platform !== 'all' && match.platform !== view.platform) view.platform = 'all';
            if (view.onlyFailed && match.status !== 'failed') view.onlyFailed = false;
            view.focusRecordId = pubId;
            syncInputs();
            render();
            document.querySelector(`[data-mark-item="pub-${CSS.escape(pubId)}"]`)?.scrollIntoView({ behavior: 'auto', block: 'center' });
          },
        },
      },
    });

    function syncInputs() {
      platEl.value = view.platform;
      failEl.checked = view.onlyFailed;
    }

    function render() {
      if (!payload) return;
      document.getElementById('subtitle').textContent = `Synced: ${payload.generatedAt || 'not built yet'}`;
      const s = payload.summary || {};
      document.getElementById('kpis').innerHTML = [
        ['Accounts', s.totalAccounts ?? 0, 'kpi-accts'],
        ['Healthy', s.healthyAccounts ?? 0, 'kpi-healthy'],
        ['Needs Auth Attention', s.attentionAccounts ?? 0, 'kpi-attn'],
        ['Verified Published', s.totalPublished ?? 0, 'kpi-pub'],
        ['Failed Attempts', s.totalFailed ?? 0, 'kpi-fail'],
      ].map(([label, val, id]) => `
        <div class="kpi" data-mark-item="${id}" data-mark-label="${label}">
          <div class="kpi-label">${label}</div>
          <div class="kpi-value">${val}</div>
        </div>`).join('');

      let accounts = (payload.accounts || []).slice();
      let records = (payload.records || []).slice();
      if (view.platform !== 'all') {
        accounts = accounts.filter((a) => a.platform === view.platform);
        records = records.filter((r) => r.platform === view.platform);
      }
      if (view.onlyFailed) {
        accounts = accounts.filter((a) => a.status === 'expired' || a.status === 'expiring');
        records = records.filter((r) => r.status === 'failed');
      }

      document.getElementById('accountsGrid').innerHTML = accounts.length === 0
        ? '<div class="sub">No accounts match the current filter.</div>'
        : accounts.map((a) => `
          <article class="acct" data-mark-item="acct-${esc(a.accountId)}" data-mark-label="${esc(a.handle || a.accountId)}">
            <div><strong>${esc(a.displayName || a.handle || a.accountId)}</strong> <span class="badge b-${esc(a.status)}">${esc(a.status)}</span></div>
            <div class="sub">${esc(a.platform)} · ${esc(a.handle || '')} · Followers: ${esc(a.followers ?? '—')}</div>
            <div class="sub">Env keys: ${(a.envKeys || []).map(esc).join(', ') || 'browser session'}</div>
            ${a.status === 'expired' || a.status === 'expiring'
              ? `<div class="row-action" data-mark-ignore><button data-requires-sdk data-action="reauth" data-id="${esc(a.accountId)}" data-plat="${esc(a.platform)}">Draft Re-Auth Check</button></div>`
              : ''}
          </article>`).join('');

      document.getElementById('ledgerBody').innerHTML = records.length === 0
        ? '<tr><td colspan="6" class="sub">No publish records yet.</td></tr>'
        : records.map((r) => {
            const focused = view.focusRecordId === r.publishId ? ' class="focused"' : '';
            return `
              <tr${focused} data-mark-item="pub-${esc(r.publishId)}" data-mark-label="${esc(r.publishId)}">
                <td>${esc(r.publishedAt || '—')}</td>
                <td>${esc(r.platform || '—')}</td>
                <td>${esc(r.draftId || '—')}<div class="sub">${esc(r.slotId || '')}</div></td>
                <td><span class="badge b-${esc(r.status)}">${esc(r.status)}</span></td>
                <td>
                  ${r.publicUrl && /^https?:\/\//i.test(r.publicUrl)
                    ? `<a href="${esc(r.publicUrl)}" target="_blank" rel="noopener">${esc(r.publicUrl)}</a>`
                    : (r.publicUrl ? esc(r.publicUrl) : '—')}
                  ${r.error ? `<div class="sub" style="color:var(--err)">${esc(r.error)}</div>` : ''}
                </td>
                <td class="row-action" data-mark-ignore>
                  ${r.status === 'failed'
                    ? `<button data-requires-sdk data-action="diagnose" data-id="${esc(r.publishId)}" data-plat="${esc(r.platform)}">Draft Failure Triage</button>`
                    : ''}
                </td>
              </tr>`;
          }).join('');
      bridge.updateWriteControls();
    }

    document.body.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'reauth') {
        void bridge.stageDraft(
          `Account ${btn.dataset.id} on ${btn.dataset.plat} is expiring/expired. Please verify env credentials and guide re-authorization before the next scheduled slot.`,
          btn,
        );
      } else if (btn.dataset.action === 'diagnose') {
        void bridge.stageDraft(
          `Publish record ${btn.dataset.id} on ${btn.dataset.plat} failed. Please inspect live account works first (to rule out duplicate publish), diagnose the error, and propose next steps.`,
          btn,
        );
      }
    });

    for (const el of [platEl, failEl]) {
      el.addEventListener('change', () => {
        view.platform = platEl.value;
        view.onlyFailed = failEl.checked;
        render();
        void bridge.persistView();
      });
    }

    void bridge.start();
  </script>
</body>
</html>
