<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Matrix &amp; Publish Ledger Board</title>
  <link rel="stylesheet" href="./runtime/board-ui.css" />
  <style>
    .acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .acct-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .acct-name { font-size: 14px; font-weight: 600; color: var(--foreground); }
    .err-note { font-size: 12px; color: var(--destructive); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="ui-shell" data-ducoro-export-frame="ledger-summary">
    <header class="ui-header" data-card="ledger-header" data-card-title="Account Matrix & Publish Ledger">
      <div>
        <h1 class="ui-title" data-mark-item="board-title" data-mark-label="Ledger Title">Account Matrix &amp; Publish Ledger</h1>
        <p class="ui-subtitle" id="subtitle">Loading ledger snapshot...</p>
      </div>
      <div class="ui-toolbar" data-mark-ignore>
        <select class="ui-select" id="platformFilter" aria-label="Filter by platform"><option value="all">All Platforms</option></select>
        <label class="ui-check-pill"><input type="checkbox" id="onlyFailed" /><span>Needs attention only</span></label>
      </div>
    </header>

    <div class="ui-alert" data-bridge-status data-mark-ignore hidden></div>
    <section class="ui-kpi-grid" id="kpis" data-card="ledger-kpis" data-card-title="Ledger Summary"></section>

    <section class="ui-section">
      <div class="ui-section-head">
        <h2 class="ui-section-title">Connected Accounts</h2>
      </div>
      <div class="acct-grid" id="accountsGrid" data-card="accounts-matrix" data-card-title="Connected Accounts"></div>
    </section>

    <section class="ui-section" data-card="publish-ledger" data-card-title="Publish Ledger">
      <div class="ui-section-head">
        <h2 class="ui-section-title">Publish Ledger</h2>
        <span class="ui-muted">Append-only live readback</span>
      </div>
      <div class="ui-table-wrap">
        <table class="ui-table">
          <thead>
            <tr>
              <th>Published</th>
              <th>Platform</th>
              <th>Draft / Slot</th>
              <th>Status</th>
              <th>Live Link / Error</th>
              <th data-shot-hide>Action</th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script id="board-initial-data" type="application/json">
  {"schemaVersion":1,"board":"publish-ledger-board","generatedAt":"","timezone":"UTC","platforms":[],"summary":{"totalAccounts":0,"healthyAccounts":0,"attentionAccounts":0,"totalPublished":0,"totalFailed":0},"accounts":[],"records":[]}
  </script>

  <script type="module">
    import { createBoardBridge } from './runtime/board-sdk-bridge.js';

    let payload = null;
    const view = { platform: 'all', onlyFailed: false, focusRecordId: '' };
    const platEl = document.getElementById('platformFilter');
    const failEl = document.getElementById('onlyFailed');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const statusTone = (st) => {
      if (st === 'expiring' || st === 'draft_saved') return 'warning';
      if (st === 'expired' || st === 'failed' || st === 'paused') return 'destructive';
      return 'neutral';
    };

    const bridge = createBoardBridge({
      boardId: 'publish-ledger-board',
      defaultView: { platform: 'all', onlyFailed: false },
      getView: () => ({ platform: view.platform, onlyFailed: view.onlyFailed }),
      onApplyView: (saved) => {
        if (typeof saved.platform === 'string') view.platform = saved.platform;
        if (typeof saved.onlyFailed === 'boolean') view.onlyFailed = saved.onlyFailed;
        syncInputs();
        render();
      },
      onData: (next) => {
        payload = next;
        const plats = payload.platforms || [];
        if (view.platform !== 'all' && !plats.includes(view.platform)) view.platform = 'all';
        platEl.innerHTML = '<option value="all">All Platforms</option>' +
          plats.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
        syncInputs();
        render();
      },
      commands: {
        filterPlatform: {
          describe: 'Filter accounts and publish records by platform slug or "all".',
          params: { platform: 'Platform slug or "all".' },
          run: ({ platform }) => {
            const valid = ['all', ...(payload?.platforms || [])];
            if (!valid.includes(platform)) throw new Error(`Unknown platform "${platform}". Valid values: ${valid.join(', ')}`);
            view.platform = platform;
            syncInputs();
            render();
          },
        },
        onlyFailed: {
          describe: 'Toggle showing only failed records and attention accounts.',
          params: { enabled: '"true" or "false".' },
          run: ({ enabled }) => {
            if (enabled !== 'true' && enabled !== 'false') throw new Error('enabled must be "true" or "false"');
            view.onlyFailed = enabled === 'true';
            syncInputs();
            render();
          },
        },
        focusRecord: {
          describe: 'Highlight and scroll to a publish record by publishId.',
          params: { pubId: 'Exact publishId from publish-log.jsonl.' },
          run: ({ pubId }) => {
            const recs = payload?.records || [];
            const match = recs.find((r) => r.publishId === pubId);
            if (!match) throw new Error(`Unknown pubId "${pubId}". Valid IDs: ${recs.map((r) => r.publishId).join(', ') || '(none)'}`);
            if (view.platform !== 'all' && match.platform !== view.platform) view.platform = 'all';
            if (view.onlyFailed && match.status !== 'failed') view.onlyFailed = false;
            view.focusRecordId = pubId;
            syncInputs();
            render();
            document.querySelector(`[data-mark-item="pub-${CSS.escape(pubId)}"]`)?.scrollIntoView({ behavior: 'auto', block: 'center' });
          },
        },
      },
    });

    function syncInputs() {
      platEl.value = view.platform;
      failEl.checked = view.onlyFailed;
    }

    function render() {
      if (!payload) return;
      document.getElementById('subtitle').textContent = `Synced ${payload.generatedAt || 'pending'}`;
      const s = payload.summary || {};
      const attn = s.attentionAccounts ?? 0;
      const failed = s.totalFailed ?? 0;
      document.getElementById('kpis').innerHTML = [
        ['Accounts', s.totalAccounts ?? 0, 'kpi-accts', ''],
        ['Healthy', s.healthyAccounts ?? 0, 'kpi-healthy', ''],
        ['Auth Attention', attn, 'kpi-attn', attn > 0 ? 'warning' : ''],
        ['Verified Published', s.totalPublished ?? 0, 'kpi-pub', ''],
        ['Failed Attempts', failed, 'kpi-fail', failed > 0 ? 'destructive' : ''],
      ].map(([label, val, id, tone]) => `
        <div class="ui-kpi" data-mark-item="${id}" data-mark-label="${label}">
          <div class="ui-kpi-label">${label}</div>
          <div class="ui-kpi-value"${tone ? ` data-tone="${tone}"` : ''}>${val}</div>
        </div>`).join('');

      let accounts = (payload.accounts || []).slice();
      let records = (payload.records || []).slice();
      if (view.platform !== 'all') {
        accounts = accounts.filter((a) => a.platform === view.platform);
        records = records.filter((r) => r.platform === view.platform);
      }
      if (view.onlyFailed) {
        accounts = accounts.filter((a) => a.status === 'expired' || a.status === 'expiring');
        records = records.filter((r) => r.status === 'failed');
      }

      document.getElementById('accountsGrid').innerHTML = accounts.length === 0
        ? '<div class="ui-empty" style="grid-column:1/-1">No accounts match the current filter.</div>'
        : accounts.map((a) => `
          <article class="ui-card" style="display:flex;flex-direction:column;gap:6px" data-mark-item="acct-${esc(a.accountId)}" data-mark-label="${esc(a.handle || a.accountId)}">
            <div class="acct-head">
              <div class="acct-name">${esc(a.displayName || a.handle || a.accountId)}</div>
              <span class="ui-status ui-status-${statusTone(a.status)}">${esc(String(a.status || '').replace(/_/g, ' '))}</span>
            </div>
            <div class="ui-muted">${esc(a.platform)} · ${esc(a.handle || '—')} · <span class="ui-num">${a.followers != null ? a.followers.toLocaleString() : '—'}</span> followers</div>
            <div class="ui-muted ui-mono">${(a.envKeys || []).map(esc).join(', ') || 'browser session'}</div>
            ${a.status === 'expired' || a.status === 'expiring'
              ? `<div class="ui-actions" data-mark-ignore><button class="ui-btn ui-btn-xs ui-btn-primary-ghost" type="button" data-requires-sdk data-action="reauth" data-id="${esc(a.accountId)}" data-plat="${esc(a.platform)}">Draft Re-Auth Check</button></div>`
              : ''}
          </article>`).join('');

      document.getElementById('ledgerBody').innerHTML = records.length === 0
        ? '<tr><td colspan="6" class="ui-muted" style="text-align:center;padding:24px">No publish records yet.</td></tr>'
        : records.map((r) => {
            const focused = view.focusRecordId === r.publishId ? ' class="focused"' : '';
            return `
              <tr${focused} data-mark-item="pub-${esc(r.publishId)}" data-mark-label="${esc(r.publishId)}">
                <td class="ui-mono ui-muted">${esc(r.publishedAt || '—')}</td>
                <td><span class="ui-badge ui-badge-secondary">${esc(r.platform || '—')}</span></td>
                <td><div>${esc(r.draftId || '—')}</div><div class="ui-muted ui-mono">${esc(r.slotId || '')}</div></td>
                <td><span class="ui-status ui-status-${statusTone(r.status)}">${esc(String(r.status || '').replace(/_/g, ' '))}</span></td>
                <td>
                  ${r.publicUrl && /^https?:\/\//i.test(r.publicUrl)
                    ? `<a href="${esc(r.publicUrl)}" target="_blank" rel="noopener">${esc(r.publicUrl)}</a>`
                    : (r.publicUrl ? esc(r.publicUrl) : '<span class="ui-muted">—</span>')}
                  ${r.error ? `<div class="err-note">${esc(r.error)}</div>` : ''}
                </td>
                <td data-shot-hide data-mark-ignore>
                  ${r.status === 'failed'
                    ? `<button class="ui-btn ui-btn-xs ui-btn-destructive-ghost" type="button" data-requires-sdk data-action="diagnose" data-id="${esc(r.publishId)}" data-plat="${esc(r.platform)}">Triage Failure</button>`
                    : ''}
                </td>
              </tr>`;
          }).join('');
      bridge.updateWriteControls();
    }

    document.body.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'reauth') {
        void bridge.stageDraft(
          `Account ${btn.dataset.id} on ${btn.dataset.plat} is expiring/expired. Please verify env credentials and guide re-authorization before the next scheduled slot.`,
          btn,
        );
      } else if (btn.dataset.action === 'diagnose') {
        void bridge.stageDraft(
          `Publish record ${btn.dataset.id} on ${btn.dataset.plat} failed. Please inspect live account works first (to rule out duplicate publish), diagnose the error, and propose next steps.`,
          btn,
        );
      }
    });

    for (const el of [platEl, failEl]) {
      el.addEventListener('change', () => {
        view.platform = platEl.value;
        view.onlyFailed = failEl.checked;
        render();
        void bridge.persistView();
      });
    }

    void bridge.start();
  </script>
</body>
</html>
