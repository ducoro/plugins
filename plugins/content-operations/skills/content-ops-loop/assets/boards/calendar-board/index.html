<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Calendar &amp; Schedule Board</title>
  <link rel="stylesheet" href="./runtime/board-ui.css" />
  <style>
    .festivals { display: flex; flex-wrap: wrap; gap: 6px; }
    .day-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
    .day-date { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .day-slots { display: flex; flex-direction: column; gap: 8px; }
    .slot-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: color-mix(in oklch, var(--muted) 45%, var(--card)); display: flex; flex-direction: column; gap: 6px; }
    .slot-item.focused { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .slot-err { font-size: 12px; color: var(--destructive); }
  </style>
</head>
<body>
  <div class="ui-shell" data-export-frame="calendar-overview">
    <header class="ui-header" data-card="calendar-header" data-card-title="Calendar Overview">
      <div>
        <h1 class="ui-title" data-mark-item="board-title" data-mark-label="Calendar Title">Content Calendar &amp; Schedule</h1>
        <p class="ui-subtitle" id="subtitle">Loading schedule snapshot...</p>
      </div>
      <div class="ui-toolbar" data-mark-ignore>
        <div class="ui-tabs" role="tablist" aria-label="Calendar range">
          <button class="ui-tab" type="button" role="tab" data-mode="month">Month</button>
          <button class="ui-tab" type="button" role="tab" data-mode="week">Next 7 Days</button>
        </div>
        <select class="ui-select" id="platformFilter" aria-label="Filter by platform"><option value="all">All Platforms</option></select>
        <select class="ui-select" id="statusFilter" aria-label="Filter by status">
          <option value="all">All Statuses</option>
          <option value="planned">Planned</option>
          <option value="awaiting_approval">Awaiting Approval</option>
          <option value="approved">Approved</option>
          <option value="published">Published</option>
          <option value="failed">Failed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    </header>

    <div class="ui-alert" data-bridge-status data-mark-ignore hidden></div>
    <section class="ui-kpi-grid" id="kpis" data-card="calendar-kpis" data-card-title="Schedule Summary"></section>
    <section class="festivals" id="festivals" data-card="seasonal-anchors" data-card-title="Seasonal Anchors"></section>
    <main id="calendarGrid"></main>
  </div>

  <script id="board-initial-data" type="application/json">
  {"schemaVersion":1,"board":"calendar-board","generatedAt":"","timezone":"UTC","platforms":[],"summary":{"totalSlots":0,"awaitingApproval":0,"approved":0,"published":0,"failed":0},"slots":[],"festivals":[]}
  </script>

  <script type="module">
    import { createBoardBridge } from './runtime/board-sdk-bridge.js';

    let payload = null;
    const view = { mode: 'month', platform: 'all', status: 'all', focusDate: '', focusSlotId: '' };
    const platEl = document.getElementById('platformFilter');
    const statusEl = document.getElementById('statusFilter');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const statusTone = (st) => {
      if (st === 'awaiting_approval') return 'warning';
      if (st === 'failed' || st === 'cancelled') return 'destructive';
      return 'neutral';
    };

    const statusLabel = (st) => String(st || 'planned').replace(/_/g, ' ');

    const bridge = createBoardBridge({
      boardId: 'calendar-board',
      defaultView: { mode: 'month', platform: 'all', status: 'all' },
      getView: () => ({ mode: view.mode, platform: view.platform, status: view.status }),
      onApplyView: (saved) => {
        if (saved.mode === 'month' || saved.mode === 'week') view.mode = saved.mode;
        if (typeof saved.platform === 'string') view.platform = saved.platform;
        if (typeof saved.status === 'string') view.status = saved.status;
        syncInputs();
        render();
      },
      onData: (next) => {
        payload = next;
        populatePlatforms();
        syncInputs();
        render();
      },
      commands: {
        setView: {
          describe: 'Switch calendar display between month and week view.',
          params: { mode: 'Either "month" or "week".' },
          run: ({ mode }) => {
            if (mode !== 'month' && mode !== 'week') throw new Error('mode must be "month" or "week"');
            view.mode = mode;
            syncInputs();
            render();
          },
        },
        goToDate: {
          describe: 'Focus a specific calendar date card (YYYY-MM-DD).',
          params: { date: 'Target date in YYYY-MM-DD format present in the schedule.' },
          run: ({ date }) => {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('date must match YYYY-MM-DD');
            const dt = new Date(`${date}T00:00:00Z`);
            if (Number.isNaN(dt.getTime()) || dt.toISOString().slice(0, 10) !== date) {
              throw new Error(`Invalid calendar date: ${date}`);
            }
            const dates = [...new Set((payload?.slots || []).map((s) => s.date).filter(Boolean))].sort();
            if (!dates.includes(date)) {
              throw new Error(`No schedule card for ${date}. Available dates: ${dates.join(', ') || '(none)'}`);
            }
            view.mode = 'month';
            view.platform = 'all';
            view.status = 'all';
            view.focusDate = date;
            view.focusSlotId = '';
            syncInputs();
            render();
            document.querySelector(`[data-card="day-${CSS.escape(date)}"]`)?.scrollIntoView({ behavior: 'auto', block: 'center' });
          },
        },
        filterPlatform: {
          describe: 'Filter calendar slots by platform slug or "all".',
          params: { platform: 'Platform slug or "all".' },
          run: ({ platform }) => {
            const valid = ['all', ...(payload?.platforms || [])];
            if (!valid.includes(platform)) throw new Error(`Unknown platform "${platform}". Valid values: ${valid.join(', ')}`);
            view.platform = platform;
            syncInputs();
            render();
          },
        },
        focusSlot: {
          describe: 'Highlight and scroll to a specific schedule slot.',
          params: { slotId: 'Exact slotId from calendar.json.' },
          run: ({ slotId }) => {
            const slots = payload?.slots || [];
            const match = slots.find((s) => s.slotId === slotId);
            if (!match) throw new Error(`Unknown slotId "${slotId}". Valid IDs: ${slots.map((s) => s.slotId).join(', ') || '(none)'}`);
            view.mode = 'month';
            if (view.platform !== 'all' && match.platform !== view.platform) view.platform = 'all';
            if (view.status !== 'all' && match.status !== view.status) view.status = 'all';
            view.focusDate = '';
            view.focusSlotId = slotId;
            syncInputs();
            render();
            document.querySelector(`[data-mark-item="slot-${CSS.escape(slotId)}"]`)?.scrollIntoView({ behavior: 'auto', block: 'center' });
          },
        },
      },
    });

    function populatePlatforms() {
      const list = payload?.platforms || [];
      if (view.platform !== 'all' && !list.includes(view.platform)) view.platform = 'all';
      platEl.innerHTML = '<option value="all">All Platforms</option>' +
        list.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    }

    function localDateStr(dateObj, tz) {
      try {
        return new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'UTC', year: 'numeric', month: '2-digit', day: '2-digit' }).format(dateObj);
      } catch {
        return dateObj.toISOString().slice(0, 10);
      }
    }

    function syncInputs() {
      platEl.value = view.platform;
      statusEl.value = view.status;
      for (const btn of document.querySelectorAll('.ui-tab[data-mode]')) {
        const active = btn.dataset.mode === view.mode;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-selected', String(active));
      }
    }

    function render() {
      if (!payload) return;
      document.getElementById('subtitle').textContent =
        `Timezone ${payload.timezone || 'UTC'} · Synced ${payload.generatedAt || 'pending'}`;

      const s = payload.summary || {};
      const awaiting = s.awaitingApproval ?? 0;
      const failed = s.failed ?? 0;
      document.getElementById('kpis').innerHTML = [
        ['Total Slots', s.totalSlots ?? 0, 'kpi-total', ''],
        ['Awaiting Gate 2', awaiting, 'kpi-awaiting', awaiting > 0 ? 'warning' : ''],
        ['Approved', s.approved ?? 0, 'kpi-approved', ''],
        ['Published', s.published ?? 0, 'kpi-published', ''],
        ['Failed', failed, 'kpi-failed', failed > 0 ? 'destructive' : ''],
      ].map(([label, val, id, tone]) => `
        <div class="ui-kpi" data-mark-item="${id}" data-mark-label="${label}">
          <div class="ui-kpi-label">${label}</div>
          <div class="ui-kpi-value"${tone ? ` data-tone="${tone}"` : ''}>${val}</div>
        </div>`).join('');

      const fests = (payload.festivals || []).slice(0, 8);
      const festEl = document.getElementById('festivals');
      festEl.hidden = fests.length === 0;
      festEl.innerHTML = fests.map((f) => {
        const fid = f.id || String(f.date || 'anchor').replace(/[^a-z0-9-]/gi, '-');
        return `<span class="ui-badge ui-badge-outline ui-num" data-mark-item="fest-${esc(fid)}" data-mark-label="${esc(f.name)}">${esc(f.date)} · ${esc(f.name)}</span>`;
      }).join('');

      let slots = (payload.slots || []).slice();
      if (view.platform !== 'all') slots = slots.filter((x) => x.platform === view.platform);
      if (view.status !== 'all') slots = slots.filter((x) => x.status === view.status);
      if (view.mode === 'week') {
        const now = new Date();
        const today = localDateStr(now, payload.timezone);
        const cutoff = localDateStr(new Date(now.getTime() + 7 * 86400 * 1000), payload.timezone);
        slots = slots.filter((x) => !x.date || (x.date >= today && x.date <= cutoff));
      }

      const byDate = new Map();
      for (const slot of slots) {
        const key = slot.date || 'Unscheduled';
        if (!byDate.has(key)) byDate.set(key, []);
        byDate.get(key).push(slot);
      }

      const grid = document.getElementById('calendarGrid');
      if (byDate.size === 0) {
        grid.innerHTML = '<div class="ui-empty" data-card="calendar-empty" data-card-title="Empty Schedule">No scheduled slots match the current filters. Add entries to calendar.json and run build_boards.py.</div>';
        bridge.updateWriteControls();
        return;
      }

      const days = [...byDate.keys()].sort();
      grid.innerHTML = `<div class="ui-card-grid">${days.map((day) => {
        const daySlots = byDate.get(day).sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
        const dayFocused = view.focusDate === day ? ' focused' : '';
        return `
          <section class="ui-card${dayFocused}" data-card="day-${esc(day)}" data-card-title="${esc(day)}">
            <div class="day-head">
              <span class="day-date">${esc(day)}</span>
              <span class="ui-muted ui-num">${daySlots.length} slot${daySlots.length === 1 ? '' : 's'}</span>
            </div>
            <div class="day-slots">
              ${daySlots.map((slot) => {
                const sid = slot.slotId || 'unknown';
                const slotFocused = view.focusSlotId === sid ? ' focused' : '';
                const tone = statusTone(slot.status);
                return `
                  <article class="slot-item${slotFocused}" data-mark-item="slot-${esc(sid)}" data-mark-label="${esc(slot.title || sid)}">
                    <div class="ui-meta-row" style="justify-content:space-between;flex-wrap:nowrap;gap:8px">
                      <div class="ui-meta-row" style="min-width:0;gap:6px">
                        <span class="ui-badge ui-badge-secondary">${esc(slot.platform || 'unknown')}</span>
                        <span class="ui-muted ui-num">${esc(slot.time || '--:--')}</span>
                      </div>
                      <span class="ui-status ui-status-${tone}" style="flex-shrink:0">${esc(statusLabel(slot.status))}</span>
                    </div>
                    <div class="ui-item-title">${esc(slot.title || sid)}</div>
                    ${slot.publicUrl ? `<a class="ui-muted" href="${esc(slot.publicUrl)}" target="_blank" rel="noopener">Verified live post ↗</a>` : ''}
                    ${slot.lastError ? `<div class="slot-err">${esc(slot.lastError)}</div>` : ''}
                    <div class="ui-actions" data-mark-ignore>
                      ${slot.status === 'awaiting_approval' ? `<button class="ui-btn ui-btn-xs ui-btn-primary-ghost" type="button" data-requires-sdk data-action="approve-slot" data-slot="${esc(sid)}">Draft Gate 2 Approval</button>` : ''}
                      <button class="ui-btn ui-btn-xs ui-btn-ghost" type="button" data-requires-sdk data-action="reschedule-slot" data-slot="${esc(sid)}">Reschedule</button>
                    </div>
                  </article>`;
              }).join('')}
            </div>
          </section>`;
      }).join('')}</div>`;
      bridge.updateWriteControls();
    }

    document.querySelector('.ui-toolbar').addEventListener('click', (event) => {
      const btn = event.target.closest('.ui-tab[data-mode]');
      if (!btn) return;
      view.mode = btn.dataset.mode;
      syncInputs();
      render();
      void bridge.persistView();
    });

    for (const el of [platEl, statusEl]) {
      el.addEventListener('change', () => {
        view.platform = platEl.value;
        view.status = statusEl.value;
        render();
        void bridge.persistView();
      });
    }

    document.getElementById('calendarGrid').addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;
      const slot = (payload?.slots || []).find((s) => s.slotId === btn.dataset.slot);
      if (!slot) return;
      if (btn.dataset.action === 'approve-slot') {
        void bridge.stageDraft(
          `Gate 2 approval for slot ${slot.slotId} (${slot.platform}, ${slot.date} ${slot.time}, draft ${slot.draftId}): verified facts and specs—please proceed with publishing and record the live URL.`,
          btn,
        );
      } else if (btn.dataset.action === 'reschedule-slot') {
        void bridge.stageDraft(
          `Please reschedule slot ${slot.slotId} (${slot.title} on ${slot.platform}, currently ${slot.date} ${slot.time}) to [new date/time] and rebuild calendar-board.`,
          btn,
        );
      }
    });

    void bridge.start();
  </script>
</body>
</html>
