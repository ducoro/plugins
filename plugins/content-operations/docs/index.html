<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Operations — Visual Overview</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-alt: #f1f4f9;
      --ink: #111827;
      --muted: #526071;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --ok: #15803d;
      --ok-soft: #f0fdf4;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.04);
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f17;
        --surface: #111827;
        --surface-alt: #1a2234;
        --ink: #f3f4f6;
        --muted: #9ca3af;
        --border: #243045;
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.14);
        --ok: #4ade80;
        --ok-soft: rgba(74, 222, 128, 0.12);
        --warn: #fbbf24;
        --warn-soft: rgba(251, 191, 36, 0.12);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.12);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px rgba(0, 0, 0, 0.25);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0f17;
      --surface: #111827;
      --surface-alt: #1a2234;
      --ink: #f3f4f6;
      --muted: #9ca3af;
      --border: #243045;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --ok: #4ade80;
      --ok-soft: rgba(74, 222, 128, 0.12);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.12);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: var(--mono);
      font-size: 0.87em;
      background: var(--surface-alt);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .nav-links {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .nav-links a { color: var(--muted); font-weight: 500; }
    .nav-links a:hover { color: var(--ink); text-decoration: none; }
    .controls { display: flex; gap: 8px; }
    .pill-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn:hover { border-color: var(--accent); color: var(--accent); }
    .pill-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .container { max-width: 1120px; margin: 0 auto; padding: 36px 20px 80px; }
    section { margin-top: 56px; }
    .hero { margin-top: 8px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 999px;
    }
    h1 {
      margin: 14px 0 12px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.18;
      letter-spacing: -0.02em;
    }
    .lead {
      max-width: 760px;
      color: var(--muted);
      font-size: 16px;
      margin: 0 0 24px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .metric-val { font-size: 28px; font-weight: 700; line-height: 1.1; }
    .metric-lbl { font-size: 12.5px; color: var(--muted); margin-top: 5px; }

    h2 {
      font-size: 22px;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .sec-sub { color: var(--muted); font-size: 14.5px; margin: 0 0 20px; max-width: 780px; }

    /* Loop flow */
    .loop-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .step-btn {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      color: var(--ink);
      transition: border-color 0.15s, transform 0.15s;
    }
    .step-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .step-btn.active { border-color: var(--accent); background: var(--accent-soft); }
    .step-num { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
    .step-title { font-weight: 700; font-size: 14px; margin-top: 4px; }
    .step-gate {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--warn-soft);
      color: var(--warn);
    }
    .loop-detail {
      margin-top: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .detail-box h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .detail-box p, .detail-box ul { margin: 0; font-size: 14px; }
    .detail-box ul { padding-left: 18px; }

    /* Dual track */
    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card h3 { margin: 8px 0 8px; font-size: 17px; }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .card ul { margin: 0; padding-left: 18px; font-size: 14px; }
    .card li { margin-bottom: 6px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .badge-ok { background: var(--ok-soft); color: var(--ok); }
    .badge-accent { background: var(--accent-soft); color: var(--accent); }
    .badge-warn { background: var(--warn-soft); color: var(--warn); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .callout-danger {
      margin-top: 14px;
      background: var(--danger-soft);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
      color: var(--danger);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Platform filter & matrix */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .plat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }
    .plat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .plat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .plat-name { font-weight: 700; font-size: 15px; }
    .plat-meta { font-size: 12.5px; color: var(--muted); }
    .plat-tags { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Boards interactive preview */
    .board-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .board-stage {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 820px) { .board-stage { grid-template-columns: 1fr; } }
    .mock-frame {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 12.5px;
    }
    .mock-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .mock-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .mock-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
    .mock-kpi small { display: block; color: var(--muted); font-size: 10.5px; }
    .mock-kpi strong { font-size: 15px; }
    .mock-rows { display: flex; flex-direction: column; gap: 6px; }
    .mock-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* Quick start code */
    .code-block {
      position: relative;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: var(--radius);
      padding: 18px 20px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.65;
    }
    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .copy-btn:hover { background: rgba(255, 255, 255, 0.16); }

    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

      },
      {
        id: 'analytics-retro-board',
        nameEn: 'Analytics & Retro Board', nameZh: '数据与复盘展板',
        descEn: 'Switch cleanly across 7 / 14 / 30 days with synced KPIs, daily views trend, follower snapshots, same-topic cross-platform results, and weekly takeaways.',
        descZh: '7 / 14 / 30 天窗口一键切换，KPI、趋势图和作品排行同步联动；同屏看账号涨粉、同一选题在不同平台的表现差异，以及下周改进动作。',
        cmdsEn: ['Switch 7d / 14d / 30d window', 'Inspect one platform\'s native metrics', 'Highlight a work'],
        cmdsZh: ['切换 7 / 14 / 30 天窗口', '查看单平台专属指标', '高亮某篇作品'],
        draftEn: 'Recycle any weekly retrospective takeaway straight into next cycle\'s topic inbox',
        draftZh: '点一下把复盘结论直接送进下一轮选题池，形成正循环',
        kpisEn: [['Tracked Works', '18'], ['Total Views (14d)', '84,200'], ['Avg Engagement', '6.42%']],
        kpisZh: [['追踪作品', '18'], ['14 天总阅读', '84,200'], ['平均互动率', '6.42%']],
        rowsEn: [
          ['Same Topic #08: X (28.4k) vs IG (19.2k)', '2 platforms', 'badge-accent'],
          ['Account Snapshot: IG 9,800 followers', '+420 / 7d', 'badge-ok'],
          ['Next Action: Double down on 4:5 checklists', 'send to inbox', 'badge-warn'],
        ],
        rowsZh: [
          ['同题横评 #08：X (2.84万) vs IG (1.92万)', '2 平台对比', 'badge-accent'],
          ['账号快照：IG 9,800 粉丝', '7 天 +420', 'badge-ok'],
          ['下周动作：加码 4:5 清单类图文', '送回选题池', 'badge-warn'],
        ],
      },
    ];

    const QUICK_SNIPPET = {
      en: `# 1. Create your local content-ops/ folder and all 5 live dashboards
python3 skills/content-ops-loop/scripts/init_workspace.py . --timezone Asia/Shanghai

# 2. Score new topic ideas and flag anything repeated within 14 days
python3 skills/topic-research/scripts/score_topics.py ./content-ops

# 3. Check every platform variant's text, images, ratios, and required fields
python3 skills/media-production/scripts/check_media_specs.py ./content-ops/drafts/<draft-id> --update-meta

# 4. Publish via Official Browser Studio (default, zero setup)
#    Or if using Instagram/Facebook/Threads/Pinterest official APIs,
#    stage a 5-hour public URL right before publishing:
ducoro-cli media upload ./content-ops/drafts/<draft-id>/assets/cover.jpg --json

# 5. Roll up analytics, verify workspace files, and refresh all 5 dashboards
python3 skills/engagement-and-analytics/scripts/aggregate_metrics.py ./content-ops --days 14
python3 skills/content-ops-loop/scripts/validate_workspace.py ./content-ops
python3 skills/content-ops-loop/scripts/build_boards.py ./content-ops`,
      zh: `# 1. 一键建好本地 content-ops/ 工作区和全部 5 张实时展板
python3 skills/content-ops-loop/scripts/init_workspace.py . --timezone Asia/Shanghai

# 2. 给候选选题自动打分，并排查近 14 天内是否撞题
python3 skills/topic-research/scripts/score_topics.py ./content-ops

# 3. 发布前自动核对各平台字数、图片格式、画面比例与必填项
python3 skills/media-production/scripts/check_media_specs.py ./content-ops/drafts/<draft-id> --update-meta

# 4. 默认直接通过浏览器进官方创作者后台发稿（零配置）；
#    若使用 IG / FB / Threads / Pinterest 官方 API，临发前先换 5 小时临时链接：
ducoro-cli media upload ./content-ops/drafts/<draft-id>/assets/cover.jpg --json

# 5. 汇总数据复盘、校验工作区完整性并刷新 5 张展板
python3 skills/engagement-and-analytics/scripts/aggregate_metrics.py ./content-ops --days 14
python3 skills/content-ops-loop/scripts/validate_workspace.py ./content-ops
python3 skills/content-ops-loop/scripts/build_boards.py ./content-ops`,
    };

    let lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    let activeStep = 0;
    let platFilter = 'all';
    let activeBoard = 0;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function render() {
      const t = COPY[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('langBtn').textContent = t.langToggle;
      document.getElementById('themeBtn').textContent = t.themeToggle;
      document.getElementById('topNav').innerHTML = t.nav.map(([href, label]) => `<a href="${href}">${esc(label)}</a>`).join('');

      document.getElementById('heroEyebrow').textContent = t.eyebrow;
      document.getElementById('heroTitle').textContent = t.title;
      document.getElementById('heroLead').textContent = t.lead;
      document.getElementById('heroMetrics').innerHTML = t.metrics.map(([v, l]) =>
        `<div class="metric"><div class="metric-val">${esc(v)}</div><div class="metric-lbl">${esc(l)}</div></div>`
      ).join('');

      document.getElementById('loopHeading').textContent = t.loopHeading;
      document.getElementById('loopSub').textContent = t.loopSub;
      document.getElementById('loopStrip').innerHTML = t.steps.map((s, idx) => `
        <button class="step-btn${idx === activeStep ? ' active' : ''}" data-step="${idx}" type="button">
          <div class="step-num">${esc(s.num)}</div>
          <div class="step-title">${esc(s.title)}</div>
          ${s.gate ? `<span class="step-gate">${esc(s.gate)}</span>` : ''}
        </button>`).join('');
      const st = t.steps[activeStep];
      document.getElementById('loopDetail').innerHTML = `
        <div class="detail-box"><h3>${esc(t.detailHeaders[0])}</h3><p>${esc(st.what)}</p></div>
        <div class="detail-box"><h3>${esc(t.detailHeaders[1])}</h3><ul>${st.files.map((f) => `<li><code>${esc(f)}</code></li>`).join('')}</ul></div>
        <div class="detail-box"><h3>${esc(t.detailHeaders[2])}</h3><ul>${st.scripts.map((sc) => `<li>${esc(sc)}</li>`).join('')}</ul></div>`;

      document.getElementById('channelsHeading').textContent = t.channelsHeading;
      document.getElementById('channelsSub').textContent = t.channelsSub;
      document.getElementById('dualTrackCards').innerHTML = t.dualTracks.map((c) => `
        <article class="card">
          <span class="badge ${c.badgeCls}">${esc(c.badge)}</span>
          <h3>${esc(c.title)}</h3>
          <p>${esc(c.desc)}</p>
          <ul>${c.bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
        </article>`).join('');
      document.getElementById('legitGuardrail').textContent = t.legitGuardrail;

      document.getElementById('platformsHeading').textContent = t.platformsHeading;
      document.getElementById('platformsSub').textContent = t.platformsSub;
      document.getElementById('platFilters').innerHTML = t.filters.map(([k, lbl]) =>
        `<button class="pill-btn${platFilter === k ? ' active' : ''}" data-pfilter="${k}" type="button">${esc(lbl)}</button>`
      ).join('');
      const filtered = PLATFORMS.filter((p) => {
        if (platFilter === 'cn') return p.region === 'cn';
        if (platFilter === 'global') return p.region === 'global';
        if (platFilter === 'api') return p.api;
        if (platFilter === 'browser-only') return !p.api;
        return true;
      });
      document.getElementById('platGrid').innerHTML = filtered.map((p) => `
        <article class="plat-card">
          <div class="plat-head">
            <span class="plat-name">${esc(lang === 'zh' ? p.nameZh : p.nameEn)}</span>
            <span class="badge ${p.api ? 'badge-accent' : 'badge-ok'}">${p.api ? (lang === 'zh' ? '浏览器 + 官方 API' : 'Browser + API') : (lang === 'zh' ? '官方浏览器' : 'Browser Only')}</span>
          </div>
          <div class="plat-meta"><code>platform-${esc(p.id)}</code> · ${esc(p.studio)}</div>
          <div class="plat-meta">${esc(lang === 'zh' ? p.modesZh : p.modesEn)} · ${esc(lang === 'zh' ? p.limitsZh : p.limitsEn)}</div>
          <div class="plat-meta">${esc(lang === 'zh' ? p.apiNoteZh : p.apiNoteEn)}</div>
          <div class="plat-tags"><span class="badge badge-warn">${esc(lang === 'zh' ? p.metricZh : p.metricEn)}</span></div>
        </article>`).join('');

      document.getElementById('boardsHeading').textContent = t.boardsHeading;
      document.getElementById('boardsSub').textContent = t.boardsSub;
      document.getElementById('boardTabs').innerHTML = BOARDS.map((b, idx) =>
        `<button class="pill-btn${activeBoard === idx ? ' active' : ''}" data-board="${idx}" type="button">${esc(lang === 'zh' ? b.nameZh : b.nameEn)}</button>`
      ).join('');
      const bd = BOARDS[activeBoard];
      const bKpis = lang === 'zh' ? bd.kpisZh : bd.kpisEn;
      const bRows = lang === 'zh' ? bd.rowsZh : bd.rowsEn;
      const bCmds = lang === 'zh' ? bd.cmdsZh : bd.cmdsEn;
      const bDraft = lang === 'zh' ? bd.draftZh : bd.draftEn;
      document.getElementById('boardStage').innerHTML = `
        <div class="mock-frame">
          <div class="mock-bar"><span>${esc(lang === 'zh' ? bd.nameZh : bd.nameEn)}</span><code>${esc(bd.id)}/</code></div>
          <div class="mock-kpis">${bKpis.map(([l, v]) => `<div class="mock-kpi"><small>${esc(l)}</small><strong>${esc(v)}</strong></div>`).join('')}</div>
          <div class="mock-rows">${bRows.map(([text, tag, cls]) => `<div class="mock-row"><span>${esc(text)}</span><span class="badge ${cls}">${esc(tag)}</span></div>`).join('')}</div>
        </div>
        <div>
          <h3 style="margin:0 0 8px">${esc(lang === 'zh' ? bd.nameZh : bd.nameEn)}</h3>
          <p style="margin:0 0 14px;color:var(--muted);font-size:14px">${esc(lang === 'zh' ? bd.descZh : bd.descEn)}</p>
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">${esc(t.boardMetaLabels[0])}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${bCmds.map((c) => `<span class="badge badge-accent">${esc(c)}</span>`).join('')}</div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">${esc(t.boardMetaLabels[1])}</div>
          <div style="font-size:13.5px">${esc(bDraft)}</div>
        </div>`;

      document.getElementById('topoHeading').textContent = t.topoHeading;
      document.getElementById('topoSub').textContent = t.topoSub;
      document.getElementById('topoCards').innerHTML = t.topos.map((c) => `
        <article class="card">
          <span class="badge ${c.badgeCls}">${esc(c.badge)}</span>
          <h3>${esc(c.title)}</h3>
          <p>${esc(c.desc)}</p>
          <ul>${c.bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
        </article>`).join('');

      document.getElementById('quickHeading').textContent = t.quickHeading;
      document.getElementById('quickSub').textContent = t.quickSub;
      document.getElementById('quickCode').textContent = QUICK_SNIPPET[lang];
      document.getElementById('copyCmdBtn').textContent = t.copy;

      document.getElementById('footerLeft').textContent = t.footerLeft;
      document.getElementById('footerReadmeLink').textContent = t.footerReadme;
    }

    document.getElementById('langBtn').addEventListener('click', () => {
      lang = lang === 'en' ? 'zh' : 'en';
      render();
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.dataset.theme;
      const darkPref = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = cur ? cur === 'dark' : darkPref;
      document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
    });

    document.getElementById('loopStrip').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-step]');
      if (!btn) return;
      activeStep = Number(btn.dataset.step);
      render();
    });

    document.getElementById('platFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-pfilter]');
      if (!btn) return;
      platFilter = btn.dataset.pfilter;
      render();
    });

    document.getElementById('boardTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-board]');
      if (!btn) return;
      activeBoard = Number(btn.dataset.board);
      render();
    });

    document.getElementById('copyCmdBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copyCmdBtn');
      try {
        await navigator.clipboard.writeText(QUICK_SNIPPET[lang]);
        btn.textContent = COPY[lang].copied;
        setTimeout(() => { btn.textContent = COPY[lang].copy; }, 1600);
      } catch {
        btn.textContent = COPY[lang].copy;
      }
    });

    render();
  </script>
</body>
</html>
